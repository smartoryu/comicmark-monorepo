# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json

# Development services for ComicMark.
#
# Only what this project actually uses is here:
#
#   - Mailpit (1025, 8025): local email testing. The `smtp` mailer driver targets
#     it, and http://localhost:8025 shows the verification and password-reset mail.
#   - Jaeger (16686, 4317): trace collection for the instrumented build.
#
# ComicMark stores its data in SQLite, so there is no database container, and it
# has no object storage, cache or columnar analytics to run. The organisational
# template this repository was generated from ships stacks for those
# (postgresql, minio, redis, clickhouse) at
# https://oss.zero-one-group.com/monorepo/templates — they were removed here
# because they were unused and they carried hard-coded development passwords.
#
# Usage:
#   pnpm run compose:up      # start
#   pnpm run compose:down    # stop

name: comicmark-monorepo

networks:
    comicmark-monorepo_network:
        name: comicmark-monorepo_network
        driver: bridge

# @see: https://docs.docker.com/compose/how-tos/multiple-compose-files/include/

include:
    - ./docker/_stacks_/mailpit.yaml # 1025, 8025
    - ./docker/_stacks_/instrumentation.yaml # 6831,6832,5778,16686,14268,14250,4317
